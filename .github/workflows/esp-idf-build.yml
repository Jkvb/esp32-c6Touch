name: ESP-IDF build

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  build-esp32c6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32c6
          path: .
